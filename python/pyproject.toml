[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "naos"
version = "0.1.0"
description = "Python driver for NAOS devices."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "pyserial>=3.5",
    "pyserial-asyncio>=0.6",
]

[project.optional-dependencies]
test = [
    "pytest>=7",
    "pytest-asyncio>=0.21",
]

[tool.setuptools.packages.find]
include = ["naos*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
